# One-click backend setup: deploys Chef AI (OpenAI) to your Supabase project and
# rebuilds the app so it connects to Supabase.
#
# Add these in Settings → Secrets and variables → Actions → New repository secret:
#   SUPABASE_URL            https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY       Supabase → Project Settings → API Keys (anon / publishable)
#   SUPABASE_ACCESS_TOKEN   https://supabase.com/dashboard/account/tokens → Generate new token
#   GEMINI_API_KEY          https://aistudio.google.com/apikey  (FREE)   ┐ at least
#   OPENAI_API_KEY          https://platform.openai.com/api-keys (paid) ┘ one of these
# Then: Actions → setup-backend → Run workflow.
name: setup-backend

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # to start the "build" workflow afterwards

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_ACCESS_TOKEN; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && missing="$missing GEMINI_API_KEY(or OPENAI_API_KEY)"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          CLEAN=$(.github/scripts/normalize_supabase_url.sh "$SUPABASE_URL") || {
            echo "::error::SUPABASE_URL is not a Supabase Project URL (see hints above). Expected https://<ref>.supabase.co"
            exit 1
          }
          REF=$(echo "$CLEAN" | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')
          echo "SUPABASE_URL=$CLEAN" >> "$GITHUB_ENV"
          echo "PROJECT_REF=$REF" >> "$GITHUB_ENV"
          echo "Supabase project: $REF"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Store the AI key as a server-side secret (never in the app)
        run: |
          args=(DAILY_AI_LIMIT=80)
          if [ -n "$GEMINI_API_KEY" ]; then
            args+=(GEMINI_API_KEY="$GEMINI_API_KEY" AI_PROVIDER=gemini)
            echo "::notice title=AI provider::Google Gemini (free tier)"
          else
            args+=(AI_PROVIDER=openai)
            echo "::notice title=AI provider::OpenAI"
          fi
          [ -n "$OPENAI_API_KEY" ] && args+=(OPENAI_API_KEY="$OPENAI_API_KEY")
          if ! out=$(supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}" 2>&1); then
            echo "$out"
            msg=$(echo "$out" | tr '\n' ' ' | cut -c1-400)
            echo "::error title=supabase secrets set failed::$msg"
            if echo "$out" | grep -qiE '401|403|unauthori|forbidden|permission'; then
              echo "::error title=Token permission::SUPABASE_ACCESS_TOKEN cannot manage this project. Create a token with Secrets + Edge Functions write access (or a legacy token) and update the secret."
            fi
            exit 1
          fi
          echo "$out"

      - name: Deploy Edge Functions
        run: |
          for fn in chef-ai delete-account; do
            if ! out=$(supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt 2>&1); then
              echo "$out"
              echo "::error title=deploy $fn failed::$(echo "$out" | tr '\n' ' ' | tail -c 400)"
              exit 1
            fi
            echo "$out" | tail -3
          done

      - name: Check Chef AI is reachable
        run: |
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/chef-ai" \
            -H "Content-Type: application/json" -d '{"action":"chat","messages":[]}')
          echo "chef-ai answered HTTP $code (401 = deployed and correctly asking for login)"
          cat /tmp/r.txt; echo
          [ "$code" = "401" ] || [ "$code" = "400" ] || { echo "::warning::Unexpected response — check Supabase → Edge Functions → chef-ai → Logs"; }

      - name: Rebuild the app with Supabase connected
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run build.yml --repo "${{ github.repository }}" --ref main
