<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Family Food Assistant — tell it what's in your kitchen and get recipes, meal plans and shopping lists instantly.">
  <meta name="theme-color" content="#0E0B13">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Family Food">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Family Food Assistant</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0E0B13; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 10%, #3A1D24 0%, #1A1220 45%, #0E0B13 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #F7F2EE; transition: opacity .3s; }
    #splash img { width: 96px; height: 96px; border-radius: 28px; box-shadow: 0 16px 40px rgba(255,77,109,.45); animation: pop .6s ease-out; }
    #splash h1 { font-size: 26px; margin: 22px 0 6px; letter-spacing: -.3px; }
    #splash h1 span { color: #FF8A3D; }
    #splash p { margin: 0; color: #9C93A8; font-size: 15px; }
    @keyframes pop { from { transform: scale(.8); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Family Food Assistant">
    <img src="icons/Icon-192.png" alt="">
    <h1>Family<span>Food</span></h1>
    <p>Your family's smart kitchen assistant</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = 0; setTimeout(function () { s.remove(); }, 350); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
